services:
  api:
    build: .
    ports:
      - "5000:5000"
    environment:
      SECRET_KEY: dev-secret-key-change-me
      DEBUG: "false"
      HOST: 0.0.0.0
      PORT: "5000"
      DB_PATH: /app/data/loja.db
      CORS_ORIGINS: http://localhost:3000
      TOKEN_TTL_SECONDS: "28800"
      APP_ENV: desenvolvimento
      SEED_DEMO_DATA: "true"
      LOG_LEVEL: INFO
    volumes:
      - loja_data:/app/data

volumes:
  loja_data:
